<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4c1d95">
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cantina TUSEMM" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Cantina TUSEMM</title>
    <meta name="description" content="Sistema Profissional de Gestão de Vendas, Estoque e Fiados Maria Mulambo." />
    <meta property="og:title" content="Cantina TUSEMM" />
    <meta property="og:description" content="Sistema Profissional de Gestão de Vendas, Estoque e Fiados Maria Mulambo." />
    <script>
      // Global error listener to prevent cross-origin script error bubbling
      window.addEventListener('error', function(e) {
        if (!e.error && (!e.message || e.message === 'Script error.')) {
          if (e.preventDefault) e.preventDefault();
          return true;
        }
      }, true);

      // Shared reload guard to avoid double reloads across Service Worker listeners
      window.__tusemmReloading = false;

      // Prevent theme flashing on page reload (compatible with Safari Private Mode / restricted storage)
      try {
        var savedTheme = null;
        try {
          savedTheme = window.localStorage ? window.localStorage.getItem('cantina_theme') : null;
        } catch (err) {}
        if (!savedTheme && window.name && window.name.indexOf('cantina_theme=dark') !== -1) {
          savedTheme = 'dark';
        }
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script>
      // Sistema de atualização automática e desativação de cache preso
      (function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('controllerchange', function() {
              if (window.__tusemmReloading) return;
              window.__tusemmReloading = true;
              console.log('[PWA] Nova versão detectada. Recarregando página automaticamente...');
              window.location.reload();
            });

            var updateAll = function() {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var i = 0; i < registrations.length; i++) {
                  try { registrations[i].update(); } catch(e) {}
                }
              }).catch(function() {});
            };

            window.addEventListener('load', updateAll);
            window.addEventListener('focus', updateAll);
            document.addEventListener('visibilitychange', function() {
              if (document.visibilityState === 'visible') updateAll();
            });
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
